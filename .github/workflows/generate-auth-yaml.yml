name: Auto-Generate Privacy Tools Manifest

on:
  push:
    branches:
      - main
    paths:
      - 'tools/privacy/**/index.html'

# Cancel running jobs when multiple commits are pushed in quick succession
concurrency:
  group: privacy-manifest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan Directory & Generate tools/privacy/manifest.json
        run: |
          python3 -c "
          import os, json, re, html

          base_dir = 'tools/privacy'
          manifest_path = os.path.join(base_dir, 'manifest.json')

          # Baseline IDs already hardcoded in tools/privacy/index.html
          BASELINE_IDS = {
              'exif-scrub', 'pdf-cleaner', 'utm-cleaner', 'stego-extract',
              'pii-redactor', 'fingerprint-audit', 'gpc-signal', 'media-meta',
              'onion-check', 'clipboard-hijack', 'webrtc-leak', 'email-masker',
              'referrer-audit', 'storage-nuker', 'anti-ocr'
          }

          tools = []

          if os.path.exists(base_dir):
              for entry in sorted(os.listdir(base_dir)):
                  tool_dir = os.path.join(base_dir, entry)
                  index_path = os.path.join(tool_dir, 'index.html')

                  # Ignore root index.html, non-directories, and hardcoded baseline tools
                  if entry == 'index.html' or not os.path.isdir(tool_dir) or entry in BASELINE_IDS:
                      continue

                  if os.path.exists(index_path):
                      with open(index_path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()

                      # Extract Clean Title and decode HTML entities (&amp; -> &)
                      title_match = re.search(r'<title>(.*?)</title>', content, re.IGNORECASE | re.DOTALL)
                      if title_match:
                          raw_title = title_match.group(1).strip()
                          clean_title = re.split(r'\s+[—|–|-]\s+', raw_title)[0].strip()
                          clean_title = html.unescape(clean_title)
                      else:
                          clean_title = entry.replace('-', ' ').title()

                      # Extract Meta Description and decode HTML entities
                      desc_match = re.search(r'<meta\s+name=[\"\']description[\"\']\s+content=[\"\'](.*?)[\"\']', content, re.IGNORECASE | re.DOTALL)
                      if desc_match:
                          clean_desc = html.unescape(desc_match.group(1).strip())
                          clean_desc = re.sub(r'\s+', ' ', clean_desc)
                      else:
                          clean_desc = 'Zero-log client-side privacy tool.'

                      # Determine Subcategory Tag based on slug or page content
                      content_lower = content.lower()
                      entry_lower = entry.lower()
                      if any(k in entry_lower or k in content_lower for k in ['exif', 'gps', 'metadata', 'pdf', 'image', 'tag']):
                          sub = 'metadata'
                      elif any(k in entry_lower or k in content_lower for k in ['webrtc', 'utm', 'tracking', 'referrer', 'leak', 'eml']):
                          sub = 'tracking'
                      elif any(k in entry_lower or k in content_lower for k in ['redact', 'pii', 'secret', 'mask', 'scrub']):
                          sub = 'redaction'
                      else:
                          sub = 'browser'

                      tools.append({
                          'id': entry,
                          'name': clean_title,
                          'desc': clean_desc,
                          'sub': sub,
                          'engine': 'In-Memory',
                          'url': f'/tools/privacy/{entry}'
                      })

          # Write primary manifest.json
          with open(manifest_path, 'w', encoding='utf-8') as out:
              json.dump(tools, out, indent=2)

          print(f'Successfully compiled {len(tools)} dynamic tool(s) to {manifest_path}')
          "

      - name: Commit & Push manifest.json
        run: |
          git config --global user.name "BitDark Bot"
          git config --global user.email "bot@bitdark.net"
          git add tools/privacy/manifest.json
          
          # Only commit if changes exist; [skip ci] prevents recursive pipeline triggers
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(privacy): auto-update /tools/privacy/manifest.json [skip ci]"
            git push origin main
          else
            echo "No manifest changes detected. Skipping commit."
          fi
