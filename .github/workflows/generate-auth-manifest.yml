name: Auto-Generate AppSec Tools Manifest

on:
  push:
    branches:
      - main
    paths:
      - 'tools/auth/**'

concurrency:
  group: auth-manifest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan Directory & Generate tools/auth/manifest.json
        run: |
          python3 -c "
          import os, json, re, html

          base_dir = 'tools/auth'
          manifest_path = os.path.join(base_dir, 'manifest.json')

          BASELINE_IDS = {
              'jwt-offline', 'jwt-brute', 'csp-builder', 'sri-builder',
              'cors-sim', 'sec-headers', 'cookie-audit', 'pkce-gen',
              'secret-scanner', 'x509-decoder', 'tls-cipher', 'saml-decode',
              'zxcvbn-lab', 'xss-escaper', 'sql-sanitizer'
          }

          tools = []

          if os.path.exists(base_dir):
              for entry in sorted(os.listdir(base_dir)):
                  tool_dir = os.path.join(base_dir, entry)
                  index_path = os.path.join(tool_dir, 'index.html')

                  if not os.path.isdir(tool_dir) or entry in BASELINE_IDS:
                      continue

                  if os.path.exists(index_path):
                      with open(index_path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()

                      title_match = re.search(r'<title>(.*?)</title>', content, re.IGNORECASE)
                      clean_title = re.split(r'[—|–|-]', title_match.group(1))[0].strip() if title_match else entry.replace('-', ' ').title()
                      clean_title = html.unescape(clean_title)

                      desc_match = re.search(r'<meta\s+name=[\"\']description[\"\']\s+content=[\"\'](.*?)[\"\']', content, re.IGNORECASE)
                      clean_desc = html.unescape(desc_match.group(1).strip()) if desc_match else 'Client-side application security utility.'

                      check_str = f'{entry.lower()} {clean_title.lower()}'
                      if any(k in check_str for k in ['jwk', 'jwt', 'token', 'secret']):
                          sub = 'tokens'
                      elif any(k in check_str for k in ['pkce', 'saml', 'x509', 'tls', 'cert', 'oauth', 'password', 'identity', 'auth']):
                          sub = 'identity'
                      elif any(k in check_str for k in ['csp', 'cors', 'sri', 'cookie', 'hsts', 'header', 'policy']):
                          sub = 'headers'
                      elif any(k in check_str for k in ['sanitize', 'escape', 'xss', 'sql', 'injection']):
                          sub = 'sanitization'
                      else:
                          sub = 'tokens'

                      tools.append({
                          'id': entry,
                          'name': clean_title,
                          'desc': clean_desc,
                          'sub': sub,
                          'engine': 'In-Memory',
                          'url': f'/tools/auth/{entry}'
                      })

          with open(manifest_path, 'w', encoding='utf-8') as out:
              json.dump(tools, out, indent=2)

          print(f'Successfully compiled {len(tools)} dynamic tool(s) to {manifest_path}')
          "

      - name: Commit & Push manifest.json
        run: |
          git config --global user.name "BitDark Bot"
          git config --global user.email "bot@bitdark.net"
          git add tools/auth/manifest.json
          
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(auth): auto-update /tools/auth/manifest.json [skip ci]"
            git push origin main
          else
            echo "No changes to manifest.json detected. Skipping commit."
          fi
