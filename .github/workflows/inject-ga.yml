name: Auto-Inject Google Analytics

on:
  push:
    branches:
      - main  # Runs automatically whenever you push to your main branch

permissions:
  contents: write  # Allows the action to commit updated HTML files back to your repo

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Google Analytics injection script
        run: python inject_ga.py

      - name: Automatically commit and push changes if any HTML files were updated
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated GA tag injection for new/updated HTML pages [skip ci]"
          commit_author: "GitHub Actions Bot <actions@github.com>"
