name: Remove Google Analytics

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Robust ID-Based Cleanup
        run: |
          python3 -c '
          import os, re

          target_id = "G-R0WMWNF4NZ"
          modified_count = 0

          for root, dirs, files in os.walk("."):
              if ".git" in root:
                  continue
              for file in files:
                  if file.endswith((".html", ".htm", ".php", ".phtml", ".js")):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8", errors="ignore") as f:
                              content = f.read()

                          if target_id in content:
                              original_content = content

                              # 1. Remove any <script>...</script> block containing the ID
                              script_pattern = re.compile(r"<script[^>]*>.*?" + re.escape(target_id) + r".*?</script>", re.DOTALL | re.IGNORECASE)
                              content = script_pattern.sub("", content)

                              # 2. Remove any preceding Google tag HTML comment if left behind
                              comment_pattern = re.compile(r"<!--\s*Google tag\s*\(gtag\.js\)\s*-->", re.IGNORECASE)
                              content = comment_pattern.sub("", content)

                              if content != original_content:
                                  with open(path, "w", encoding="utf-8") as f:
                                      f.write(content)
                                  print(f"Successfully stripped ID from: {path}")
                                  modified_count += 1
                      except Exception as e:
                          print(f"Skipped {path} due to error: {e}")

          print(f"\nTotal files cleaned: {modified_count}")
          '

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Robust cleanup: Strip Google Analytics ID tags globally"
          branch: ${{ github.ref_name }}
