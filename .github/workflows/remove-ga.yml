name: Remove Google Analytics

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Write and Run Cleanup Script
        run: |
          cat << 'EOF' > clean.py
          import os
          import re

          target_id = "G-R0WMWNF4NZ"
          modified_count = 0

          for root, dirs, files in os.walk("."):
              if ".git" in root or ".github" in root:
                  continue
              for file in files:
                  if file.endswith((".html", ".htm", ".php", ".js")):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8", errors="ignore") as f:
                              content = f.read()

                          if target_id in content:
                              original = content
                              
                              # 1. Broadly match and remove ANY <script> block containing your specific ID
                              script_pattern = re.compile(r'<script[^>]*>.*?' + target_id + r'.*?</script>', re.DOTALL | re.IGNORECASE)
                              content = script_pattern.sub('', content)
                              
                              # 2. Clean up the orphaned <!-- Google tag (gtag.js) --> comment
                              comment_pattern = re.compile(r'<!--\s*Google tag \(gtag\.js\)\s*-->', re.IGNORECASE)
                              content = comment_pattern.sub('', content)

                              if content != original:
                                  with open(path, "w", encoding="utf-8") as f:
                                      f.write(content)
                                  print(f"Cleaned: {path}")
                                  modified_count += 1
                      except Exception as e:
                          print(f"Error on {path}: {e}")

          print(f"Total files cleaned: {modified_count}")
          EOF
          python3 clean.py
          rm clean.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated cleanup: Remove GA tags globally"
          branch: ${{ github.ref_name }}
