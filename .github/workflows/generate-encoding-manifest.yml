name: Auto-Generate Encoding Tools Manifest

on:
  push:
    branches:
      - main
    paths:
      - 'tools/encoding/**/index.html'

concurrency:
  group: encoding-manifest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan Directory & Generate tools/encoding/manifest.json
        run: |
          python3 -c "
          import os, json, re, html

          base_dir = 'tools/encoding'
          manifest_path = os.path.join(base_dir, 'manifest.json')

          # Baseline IDs already hardcoded in tools/encoding/index.html to avoid duplicates
          BASELINE_IDS = {
              'base-converter', 'hex-dump', 'html-entities', 'url-encoding',
              'json-formatter', 'yaml-json', 'rot-caesar', 'bitwise-calc',
              'proto-decode', 'redos-tester', 'plist-convert', 'epoch-converter',
              'stream-decomp', 'diff-viewer', 'base58-codec'
          }

          tools = []

          if os.path.exists(base_dir):
              for entry in sorted(os.listdir(base_dir)):
                  tool_dir = os.path.join(base_dir, entry)
                  index_path = os.path.join(tool_dir, 'index.html')

                  # Skip hub itself, non-directories, and baseline tools
                  if entry == 'index.html' or not os.path.isdir(tool_dir) or entry in BASELINE_IDS:
                      continue

                  if os.path.exists(index_path):
                      with open(index_path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()

                      # Extract Clean Title & Unescape entities (&amp; -> &)
                      title_match = re.search(r'<title>(.*?)</title>', content, re.IGNORECASE | re.DOTALL)
                      if title_match:
                          raw_title = title_match.group(1).strip()
                          clean_title = re.split(r'\s+[—|–|-]\s+', raw_title)[0].strip()
                          clean_title = html.unescape(clean_title)
                      else:
                          clean_title = entry.replace('-', ' ').title()

                      # Extract Meta Description & Unescape
                      desc_match = re.search(r'<meta\s+name=[\"\']description[\"\']\s+content=[\"\'](.*?)[\"\']', content, re.IGNORECASE | re.DOTALL)
                      if desc_match:
                          clean_desc = html.unescape(desc_match.group(1).strip())
                          clean_desc = re.sub(r'\s+', ' ', clean_desc)
                      else:
                          clean_desc = 'Client-side byte encoding and serialization utility.'

                      # Content-aware subcategory matching
                      content_lower = content.lower()
                      entry_lower = entry.lower()
                      check_str = f'{entry_lower} {clean_title.lower()} {clean_desc.lower()}'

                      if any(k in check_str for k in ['base64', 'base32', 'base85', 'base58', 'hex', 'radix', 'xxd']):
                          sub = 'radix'
                      elif any(k in check_str for k in ['json', 'yaml', 'xml', 'plist', 'serialize', 'format', 'toml', 'csv']):
                          sub = 'serialization'
                      elif any(k in check_str for k in ['html', 'url', 'uri', 'rot13', 'caesar', 'redos', 'diff', 'string', 'escape']):
                          sub = 'strings'
                      else:
                          sub = 'binary'

                      tools.append({
                          'id': entry,
                          'name': clean_title,
                          'desc': clean_desc,
                          'sub': sub,
                          'engine': 'In-Memory',
                          'url': f'/tools/encoding/{entry}'
                      })

          with open(manifest_path, 'w', encoding='utf-8') as out:
              json.dump(tools, out, indent=2)

          print(f'Successfully compiled {len(tools)} dynamic encoding tool(s) to {manifest_path}')
          "

      - name: Commit & Push Manifest (Zero-Loop Safe)
        run: |
          git config --global user.name "BitDark Bot"
          git config --global user.email "bot@bitdark.net"
          git add tools/encoding/manifest.json
          
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(encoding): auto-update /tools/encoding/manifest.json [skip ci]"
            git push origin main
          else
            echo "No manifest changes detected. Skipping commit."
          fi
